<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Admin · Kho kỉ niệm 11C1</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header><div><span class="badge">11C1 ADMIN</span><h1>Quản lý kỉ niệm</h1><p>Thêm và quản lý nội dung hiển thị trên User Web.</p></div><a href="index.html" target="_blank">↗ Mở User Web</a></header>
<main>
<section class="panel">
<h2>➕ Thêm kỉ niệm</h2>
<form id="form">
<label>Tiêu đề<input id="title" required placeholder="Ví dụ: Hội trại 11C1"></label>
<label>Chủ đề <input id="category" required placeholder="Ví dụ: Hội trại, Sinh nhật, Học tập..."></label>
<label>Mô tả<textarea id="description" rows="5" placeholder="Viết vài dòng về kỉ niệm..."></textarea></label>
<div class="two"><label>Ngày diễn ra<input id="event_date" type="date"></label><label>Người đăng<input id="author" placeholder="Ví dụ: Hùng"></label></div>
<label>Ảnh kỉ niệm<input id="image" type="file" accept="image/*"></label>
<div class="preview" id="preview">Chưa chọn ảnh</div>
<label class="check"><input id="visible" type="checkbox" checked> Hiển thị trên User Web</label>
<button id="submit" type="submit">Đăng kỉ niệm</button>
<p id="msg" class="msg"></p>
</form>
</section>
<section class="panel">
<div class="listhead"><div><h2>📚 Danh sách kỉ niệm</h2><small id="count">0 bài</small></div><button id="refresh" class="secondary">↻ Làm mới</button></div>
<div id="list" class="list"><div class="loading">Đang tải...</div></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.error));
}
</script>
</body></html>
