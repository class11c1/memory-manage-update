/* ===== 11C1 ADMIN · VIP LUXURY THEME (visual-only overrides) ===== */
:root {
  color-scheme: dark;
  --vip-gold: #f7d98b;
  --vip-gold-bright: #fff0bd;
  --vip-gold-deep: #9e7431;
  --vip-ink: #080a13;
}
body {
  position: relative;
  isolation: isolate;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse at 15% 8%, rgba(117, 75, 22, .24), transparent 34%),
    radial-gradient(ellipse at 88% 22%, rgba(69, 87, 154, .20), transparent 32%),
    radial-gradient(ellipse at 50% 100%, rgba(151, 105, 39, .13), transparent 38%),
    linear-gradient(135deg, #070912 0%, #101321 48%, #080a12 100%);
}
body::before,
body::after {
  content: "";
  position: fixed;
  inset: -20%;
  z-index: -1;
  pointer-events: none;
}
body::before {
  opacity: .42;
  background-image:
    radial-gradient(2px 2px at 8% 18%, #fff3c4 48%, transparent 60%),
    radial-gradient(1.5px 1.5px at 23% 72%, #f5d78c 48%, transparent 60%),
    radial-gradient(2px 2px at 41% 31%, #ffffff 48%, transparent 60%),
    radial-gradient(1px 1px at 58% 84%, #f5d78c 48%, transparent 60%),
    radial-gradient(2px 2px at 76% 14%, #fff0bd 48%, transparent 60%),
    radial-gradient(1.5px 1.5px at 91% 61%, #ffffff 48%, transparent 60%);
  background-size: 360px 300px;
  animation: vipTwinkle 5s ease-in-out infinite alternate;
}
body::after {
  opacity: .15;
  background: linear-gradient(115deg, transparent 38%, rgba(255, 231, 171, .12) 49%, transparent 60%);
  transform: translateX(-55%);
  animation: vipShimmer 12s ease-in-out infinite;
}
@keyframes vipTwinkle {
  0% { opacity: .18; transform: translateY(0); }
  100% { opacity: .58; transform: translateY(-12px); }
}
@keyframes vipShimmer {
  0%, 20% { transform: translateX(-65%); }
  75%, 100% { transform: translateX(65%); }
}
header {
  position: relative;
  border-bottom: 1px solid rgba(247, 217, 139, .24);
  background: linear-gradient(180deg, rgba(255,255,255,.035), transparent);
}
header h1 {
  color: var(--vip-gold-bright);
  text-shadow: 0 0 22px rgba(247, 217, 139, .20);
  letter-spacing: .3px;
}
header p { color: #b9b4a6; }
header a {
  color: var(--vip-gold-bright);
  border: 1px solid rgba(247, 217, 139, .42);
  background: rgba(247, 217, 139, .07);
  box-shadow: 0 0 22px rgba(247, 217, 139, .07), inset 0 0 14px rgba(247, 217, 139, .035);
  transition: .25s ease;
}
header a:hover {
  transform: translateY(-2px);
  border-color: var(--vip-gold-bright);
  box-shadow: 0 0 24px rgba(247, 217, 139, .20);
}
.badge {
  color: #fff0bd;
  background: linear-gradient(110deg, rgba(247,217,139,.17), rgba(158,116,49,.10));
  border-color: rgba(247,217,139,.48);
  box-shadow: 0 0 18px rgba(247,217,139,.12);
}
.panel {
  position: relative;
  overflow: hidden;
  background: linear-gradient(145deg, rgba(25, 27, 39, .94), rgba(12, 15, 25, .94));
  border: 1px solid rgba(247, 217, 139, .22);
  box-shadow: 0 18px 55px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.055);
  backdrop-filter: blur(14px);
}
.panel::before {
  content: "";
  position: absolute;
  top: 0;
  left: 8%;
  right: 8%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,240,189,.8), transparent);
  pointer-events: none;
}
.panel h2 { color: #f7e7bd; }
label { color: #c9c0a9; }
input, textarea {
  background: rgba(5, 8, 16, .78);
  border: 1px solid rgba(247,217,139,.17);
  transition: border-color .2s, box-shadow .2s;
}
input:focus, textarea:focus {
  border-color: rgba(255,224,151,.75);
  box-shadow: 0 0 0 3px rgba(247,217,139,.09), 0 0 18px rgba(247,217,139,.08);
}
button {
  background: linear-gradient(115deg, #8c6429, #e4c477 48%, #a87b36);
  color: #17120a;
  border: 1px solid rgba(255,240,189,.62);
  box-shadow: 0 7px 22px rgba(158,116,49,.20), inset 0 1px 0 rgba(255,255,255,.35);
  transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
}
button:hover:not(:disabled) {
  transform: translateY(-2px);
  filter: brightness(1.08);
  box-shadow: 0 10px 28px rgba(204,160,75,.30), 0 0 18px rgba(247,217,139,.13);
}
button:active:not(:disabled) { transform: translateY(0) scale(.99); }
button:disabled { opacity: .65; cursor: wait; }
.secondary,
.actions button {
  color: #f1dfb2;
  background: rgba(247,217,139,.075);
  border: 1px solid rgba(247,217,139,.24);
  box-shadow: none;
}
.actions .danger {
  color: #ffaaaa;
  border-color: rgba(255,120,120,.24);
  background: rgba(255,90,90,.07);
}
.preview {
  border-color: rgba(247,217,139,.28);
  background: rgba(5,8,16,.42);
}
.item {
  border-top-color: rgba(247,217,139,.12);
  transition: background .2s ease;
}
.item:hover {
  background: rgba(247,217,139,.035);
}
.thumb {
  border: 1px solid rgba(247,217,139,.20);
}
.info b { color: #f8edcf; }
.info small, .listhead small { color: #aaa18d; }
.msg { color: #e5cf98; }
.loading { color: #b8ad93; }
@media (prefers-reduced-motion: reduce) {
  body::before, body::after { animation: none !important; }
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
}


/* ===== ADMIN LAYOUT UPDATE: scrollable memories + relocated actions ===== */
#list {
  max-height: 620px;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 4px 10px 4px 0;
  scrollbar-width: thin;
  scrollbar-color: rgba(220, 186, 111, .65) rgba(255,255,255,.045);
  overscroll-behavior: contain;
}
#list::-webkit-scrollbar { width: 8px; }
#list::-webkit-scrollbar-track {
  background: rgba(255,255,255,.045);
  border-radius: 20px;
}
#list::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #f3d68e, #8f682e);
  border-radius: 20px;
  border: 2px solid #11131d;
}
#list::-webkit-scrollbar-thumb:hover { background: #ffe6a8; }

.item {
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr);
  grid-template-rows: auto auto;
  align-items: center;
  gap: 10px 14px;
  padding: 15px 10px;
  margin: 0 0 8px;
  border: 1px solid rgba(247,217,139,.13);
  border-radius: 14px;
  background: rgba(255,255,255,.018);
}
.item:hover {
  border-color: rgba(247,217,139,.30);
  background: rgba(247,217,139,.045);
}
.thumb {
  grid-column: 1;
  grid-row: 1 / span 2;
  width: 88px;
  height: 76px;
}
.info {
  grid-column: 2;
  grid-row: 1;
  align-self: end;
}
.actions {
  grid-column: 2;
  grid-row: 2;
  justify-content: flex-end;
  flex-wrap: wrap;
  align-self: start;
}
.actions button { min-width: 66px; }

@media (max-width: 520px) {
  #list { max-height: 520px; }
  .item {
    grid-template-columns: 70px minmax(0, 1fr);
    gap: 8px 10px;
    padding: 12px 8px;
  }
  .thumb { width: 70px; height: 68px; }
  .actions { justify-content: flex-start; }
  .actions button { padding: 7px 9px; min-width: 58px; }
}



/* ===== CALM STARFALL BACKGROUND ===== */
body::before {
  opacity: .72;
  background-image:
    radial-gradient(1px 1px at 7% 8%, rgba(255,239,190,.9) 45%, transparent 70%),
    radial-gradient(1.5px 1.5px at 19% 32%, rgba(255,255,255,.85) 45%, transparent 70%),
    radial-gradient(1px 1px at 34% 14%, rgba(245,211,137,.8) 45%, transparent 70%),
    radial-gradient(2px 2px at 51% 44%, rgba(255,246,218,.8) 45%, transparent 70%),
    radial-gradient(1px 1px at 68% 20%, rgba(245,211,137,.85) 45%, transparent 70%),
    radial-gradient(1.5px 1.5px at 83% 57%, rgba(255,255,255,.8) 45%, transparent 70%),
    radial-gradient(1px 1px at 94% 12%, rgba(255,239,190,.9) 45%, transparent 70%);
  background-size: 230px 260px;
  animation: starfallDrift 18s linear infinite, starfallTwinkle 5.5s ease-in-out infinite alternate;
}
@keyframes starfallDrift {
  from { background-position: 0 -260px; }
  to { background-position: 35px 520px; }
}
@keyframes starfallTwinkle {
  0% { opacity: .35; }
  100% { opacity: .82; }
}



/* ===== 11C1 ADMIN DYNAMIC ISLAND ===== */
.admin-island {
  position: fixed;
  z-index: 9999;
  top: max(14px, env(safe-area-inset-top));
  left: 50%;
  width: 58px;
  height: 58px;
  transform: translateX(-50%);
  display: grid;
  place-items: center;
  border: 1px solid rgba(255,231,171,.68);
  border-radius: 19px;
  color: #fff0bd;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,240,189,.22), transparent 42%),
    linear-gradient(145deg, #282116, #080a12 70%);
  box-shadow: 0 8px 28px rgba(0,0,0,.45), 0 0 22px rgba(247,217,139,.20), inset 0 1px 0 rgba(255,255,255,.2);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  animation: islandFloat 3.2s ease-in-out infinite;
  transition: width .58s cubic-bezier(.2,.9,.2,1.15), height .58s cubic-bezier(.2,.9,.2,1.15),
    border-radius .48s ease, top .48s ease, box-shadow .3s ease;
}
.admin-island::before {
  content: "✦";
  font-size: 25px;
  text-shadow: 0 0 12px #f7d98b, 0 0 26px rgba(247,217,139,.65);
}
.admin-island::after {
  content: "11C1 ADMIN";
  position: absolute;
  top: calc(100% + 7px);
  color: rgba(255,236,190,.72);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 1.7px;
  white-space: nowrap;
  text-shadow: 0 1px 8px #000;
  transition: opacity .2s ease;
}
.admin-island.is-open {
  top: max(10px, env(safe-area-inset-top));
  width: min(94vw, 440px);
  height: 66px;
  border-radius: 25px;
  animation: islandOpen .58s cubic-bezier(.2,.9,.2,1.15) both;
}
.admin-island.is-open::before { content: "✦  11C1 ADMIN"; font-size: 15px; letter-spacing: 1.3px; }
.admin-island.is-open::after { content: "CHẠM ĐỂ THU GỌN"; top: auto; right: 17px; font-size: 8px; }
@keyframes islandFloat {
  0%,100% { transform: translate(-50%,0) rotate(0deg); }
  25% { transform: translate(calc(-50% + 1px),-3px) rotate(1.2deg); }
  75% { transform: translate(calc(-50% - 1px),1px) rotate(-1.2deg); }
}
@keyframes islandOpen {
  0% { transform: translateX(-50%) scale(.82); }
  65% { transform: translateX(-50%) scale(1.035); }
  100% { transform: translateX(-50%) scale(1); }
}
.admin-island.is-open { box-shadow: 0 12px 38px rgba(0,0,0,.55), 0 0 30px rgba(247,217,139,.24), inset 0 1px 0 rgba(255,255,255,.22); }
.admin-island-content {
  padding-top: 88px;
  opacity: 0;
  transform: translateY(-12px) scale(.985);
  transform-origin: top center;
  pointer-events: none;
  transition: opacity .32s ease, transform .48s cubic-bezier(.2,.9,.2,1.1);
}
body.island-collapsed .admin-island-content {
  visibility: hidden;
  height: 0;
  overflow: hidden;
}
body.island-open .admin-island-content {
  visibility: visible;
  opacity: 1;
  height: auto;
  pointer-events: auto;
  transform: translateY(0) scale(1);
}
body.island-open .admin-island { animation: none; }
.island-hint {
  margin: 0 auto 12px;
  width: min(94vw, 440px);
  text-align: center;
  color: rgba(255,235,190,.7);
  font-size: 11px;
  letter-spacing: .7px;
}
@media (prefers-reduced-motion: reduce) {
  .admin-island, .admin-island.is-open { animation: none !important; transition-duration: .01ms !important; }
}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script id="embedded-admin-js">
const SUPABASE_URL="https://vzfhuvoiryupmauumlsp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_M6aKA96AdJIFeLcG7U9lig_BeOM97Pp";
const {createClient}=supabase,db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const fmt=v=>v?new Date(v+"T00:00:00").toLocaleDateString("vi-VN"):"Chưa có ngày";
let rows=[];

$("#image").onchange=()=>{
 const f=$("#image").files[0],p=$("#preview"); if(!f){p.textContent="Chưa chọn ảnh";return}
 const u=URL.createObjectURL(f);p.innerHTML=`<img src="${u}">`;
};

async function upload(file){
 if(!file)return null;
 const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
 const path=`${Date.now()}-${crypto.randomUUID()}.${ext}`;
 const {error}=await db.storage.from("memories").upload(path,file,{contentType:file.type||"image/jpeg",upsert:false});
 if(error)throw error;
 return path;
}

$("#form").onsubmit=async e=>{
 e.preventDefault();
 const btn=$("#submit"),msg=$("#msg");btn.disabled=true;btn.textContent="Đang đăng...";msg.textContent="";
 try{
   const file=$("#image").files[0];
   const path=await upload(file);
   const {error}=await db.from("memories").insert({
     title:$("#title").value.trim(),
     category:$("#category").value.trim()||"Khác",
     description:$("#description").value.trim(),
     event_date:$("#event_date").value||null,
     author:$("#author").value.trim()||null,
     image_url:path,
     visible:$("#visible").checked
   });
   if(error)throw error;
   msg.textContent="✓ Đã thêm kỉ niệm!";
   $("#form").reset();$("#preview").textContent="Chưa chọn ảnh";$("#visible").checked=true;
   await load();
 }catch(err){console.error(err);msg.textContent="Lỗi: "+(err.message||err)}
 finally{btn.disabled=false;btn.textContent="Đăng kỉ niệm"}
};

async function load(){
 const {data,error}=await db.from("memories").select("*").order("created_at",{ascending:false});
 if(error){$("#list").innerHTML=`<div class="loading">Không tải được: ${esc(error.message)}</div>`;return}
 rows=data||[];$("#count").textContent=rows.length+" bài";
 $("#list").innerHTML=rows.length?rows.map(m=>{
   const u=m.image_url?( /^https?:/i.test(m.image_url)?m.image_url:db.storage.from("memories").getPublicUrl(m.image_url).data.publicUrl):"";
   return `<div class="item ${m.visible?"":"hiddenrow"}"><div class="thumb">${u?`<img src="${esc(u)}">`:"📷"}</div><div class="info"><b>${esc(m.title)}</b><small>Chủ đề: ${esc(m.category||"Khác")} · ${fmt(m.event_date)} · ${m.visible?"Đang hiện":"Đang ẩn"}</small></div><div class="actions"><button data-toggle="${m.id}">${m.visible?"Ẩn":"Hiện"}</button><button class="danger" data-delete="${m.id}">Xóa</button></div></div>`
 }).join(""):`<div class="loading">Chưa có kỉ niệm.</div>`;
 document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>toggle(b.dataset.toggle));
 document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>remove(b.dataset.delete));
}
async function toggle(id){
 const m=rows.find(x=>String(x.id)===String(id));if(!m)return;
 const {error}=await db.from("memories").update({visible:!m.visible}).eq("id",id);
 if(error)alert(error.message);else load();
}
async function remove(id){
 const m=rows.find(x=>String(x.id)===String(id));if(!m)return;
 if(!confirm("Xóa kỉ niệm này?"))return;
 const {error}=await db.from("memories").delete().eq("id",id);
 if(error){alert(error.message);return}
 if(m.image_url&&!/^https?:/i.test(m.image_url))await db.storage.from("memories").remove([m.image_url]);
 load();
}
$("#refresh").onclick=load;load();
</script>

  height: auto !important;

}

  animation: islandExpand 1.35s cubic-bezier(.18,.82,.22,1) both !important;
}
#adminContent.menu-exit {
  animation: islandRetract 1.45s cubic-bezier(.35,.02,.22,1) both !important;
  pointer-events: none !important;
}
@keyframes islandExpand {
  0% {
    opacity: .15;
    clip-path: ellipse(0% 0% at 50% 32px);
    transform: scale(.88);
    filter: blur(5px);
  }
  42% {

  }

    filter: blur(0);
  }
}
@keyframes islandRetract {

  }

<script>
(() => {
  const body = document.body;
  const island = document.getElementById("adminIsland");
  const content = document.getElementById("adminContent");
  let open = false;
  let animationToken = 0;

  function setOpen(next) {
    if (next === open) return;
    open = next;
    const token = ++animationToken;
    island.classList.toggle("is-open", open);
    island.setAttribute("aria-expanded", String(open));
    island.setAttribute("aria-label", open ? "Thu gọn menu Admin" : "Mở menu Admin");

    if (open) {
      content.hidden = false;
      content.inert = false;
      content.classList.remove("menu-exit");
      content.classList.add("menu-enter");
      island.classList.remove("is-receiving", "is-opening");
      void island.offsetWidth;
      island.classList.add("is-opening");
      body.classList.add("island-open");
      body.classList.remove("island-collapsed");
      content.setAttribute("aria-hidden", "false");
    } else {
      content.classList.remove("menu-enter");
      content.classList.add("menu-exit");
      island.classList.remove("is-opening", "is-receiving");
      void island.offsetWidth;
      island.classList.add("is-receiving");
      island.inert = false;
      content.inert = true;
      body.classList.remove("island-open");
      body.classList.add("island-collapsed");
      content.setAttribute("aria-hidden", "true");
      const finish = () => {
        if (token !== animationToken || open) return;
        content.hidden = true;
        content.classList.remove("menu-exit");
        island.classList.remove("is-receiving", "is-opening");
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
      content.addEventListener("animationend", finish, { once:true });
      // Fallback for browsers that do not fire animationend.
      setTimeout(finish, 1550);
    }
  }

  island.addEventListener("click", () => setOpen(!open));
  content.hidden = true;
  content.inert = true;
  content.setAttribute("aria-hidden", "true");
  island.classList.remove("is-open");
  island.setAttribute("aria-expanded", "false");

  document.addEventListener("pointerdown", event => {
    const target = event.target.closest("button, header a");
    if (target && !target.disabled) target.classList.add("ios-pressed");
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(type => {
    document.addEventListener(type, event => {
      const target = event.target.closest && event.target.closest(".ios-pressed");
      if (target) target.classList.remove("ios-pressed");
    }, true);
  });
})();
</script>
